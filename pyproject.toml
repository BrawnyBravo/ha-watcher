[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ha-watcher"
version = "0.1.0"
description = "External watchdog for Home Assistant: runs on a separate box and alerts without depending on Home Assistant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "BrawnyBravo" }]
keywords = ["home-assistant", "watchdog", "monitoring", "ntfy", "raspberry-pi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
kasa = ["python-kasa>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ha-watcher = "ha_watcher.cli:main"

[project.urls]
Homepage = "https://github.com/BrawnyBravo/ha-watcher"
Issues = "https://github.com/BrawnyBravo/ha-watcher/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "BLE001"]
